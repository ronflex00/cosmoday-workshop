services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: sentinel-mqtt
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - type: bind
        source: ./infra/mosquitto/certs
        target: /mosquitto/certs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/mqtt/passwords
        target: /mosquitto/secrets/passwords
        read_only: true
        bind:
          create_host_path: false
      - mqtt_data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # L'équipe API peut activer ce service dès qu'un Dockerfile existe dans backend/.
  # api:
  #   build: ./backend
  #   container_name: sentinel-api
  #   restart: unless-stopped
  #   env_file: .env
  #   depends_on:
  #     - mqtt
  #     - db
  #   ports:
  #     - "8000:8000"

  # Le frontend peut être lancé en dev localement puis conteneurisé le dernier jour.

volumes:
  mqtt_data:
  postgres_data:
