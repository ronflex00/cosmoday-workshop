services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: sentinel-mqtt
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - type: bind
        source: ./infra/mosquitto/certs
        target: /mosquitto/certs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/mqtt/passwords
        target: /mosquitto/secrets/passwords
        read_only: true
        bind:
          create_host_path: false
      - mqtt_data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./secrets/db/password
        target: /run/secrets/postgres_password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    profiles: [api]
    build: ./backend
    container_name: sentinel-api
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "8883"
      MQTT_TLS: "true"
      MQTT_TLS_CA: /run/certs/ca.crt
      MQTT_USERNAME: sentinel-api
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_api_password
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173},http://localhost:8080,http://127.0.0.1:8080
      API_HISTORY_LIMIT: "120"
      TELEMETRY_STORAGE: trends
      DATABASE_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    depends_on:
      mqtt:
        condition: service_started
      db:
        condition: service_healthy
    ports:
      # Admin accesses REST/WS through authenticated SSH forwarding.
      - "127.0.0.1:8000:8000"
    volumes:
      # Retained for SQLite migration and rollback, not live storage.
      - api_data:/app/data
      - type: bind
        source: ./secrets/db/password
        target: /run/secrets/postgres_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/mosquitto/certs/ca.crt
        target: /run/certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/api/mqtt_password
        target: /run/secrets/mqtt_api_password
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    profiles: [api]
    build: ./frontend
    container_name: sentinel-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/frontend-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mqtt_data:
  postgres_data:
  api_data:
