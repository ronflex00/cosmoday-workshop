persistence true
persistence_location /mosquitto/data/
log_dest stdout

# TLS server authentication + separate MQTT credentials for each component.
listener 8883 0.0.0.0
tls_version tlsv1.2
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/acl

# Matches the current API/AI payload limit; cap concurrent LAN clients.
message_size_limit 16384
max_connections 32
